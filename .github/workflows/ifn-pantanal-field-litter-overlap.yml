name: IFN Pantanal field x litter UA overlap (non-homologating)
on:
  workflow_dispatch:
  push:
    branches: [feature/agricultural-identification-native-carbon]
    paths:
      - 'tools/audit_ifn_pantanal_field_litter_overlap.py'
      - 'tests/test_audit_ifn_pantanal_field_litter_overlap.py'
      - '.github/workflows/ifn-pantanal-field-litter-overlap.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact branch SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install XLSX reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Run cross-source synthetic integrity regressions
        run: python -m unittest tests.test_audit_ifn_pantanal_field_litter_overlap -v
      - name: Select only two licensed corrected litter sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("validation/ifn_sources.json").read_text(encoding="utf-8"))
          ids = {"ifn_serapilheira_mato_grosso_retificada_2025",
                 "ifn_serapilheira_mato_grosso_do_sul_retificada_2025"}
          selected = [r for r in source["sources"] if r["id"] in ids]
          if len(selected) != 2 or {r["id"] for r in selected} != ids:
              raise SystemExit("Required corrected litter source absent or duplicated")
          Path("pantanal_litter_registry.json").write_text(
              json.dumps({"sources": selected}, ensure_ascii=False), encoding="utf-8")
          PY
      - name: Acquire three licensed field land-use source XLSX
        run: |
          python tools/acquire_ifn_independent_data.py \
            --registry validation/ifn_field_land_use_sources.json \
            --out pantanal_field_raw --report pantanal_field_download_audit.json
      - name: Acquire two licensed corrected litter source CSV
        run: |
          python tools/acquire_ifn_independent_data.py \
            --registry pantanal_litter_registry.json \
            --out pantanal_litter_raw --report pantanal_litter_download_audit.json
      - name: Audit physical UF+UA cross-source overlap only
        run: |
          python -m tools.audit_ifn_pantanal_field_litter_overlap \
            --field-dir pantanal_field_raw --litter-dir pantanal_litter_raw \
            --field-audit pantanal_field_download_audit.json \
            --litter-audit pantanal_litter_download_audit.json \
            --report pantanal_field_litter_overlap_UNVALIDATED.json
      - name: Upload licensed provenance and descriptive counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantanal-field-litter-unvalidated-${{ github.sha }}
          path: |
            pantanal_field_download_audit.json
            pantanal_litter_download_audit.json
            pantanal_field_litter_overlap_UNVALIDATED.json
          if-no-files-found: warn
          retention-days: 30
