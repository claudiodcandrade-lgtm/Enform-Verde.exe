name: Sync V88.169 Word specification
on:
  push:
    branches: [patches-3.26.6]
    paths:
      - docs/spec_updates/V88.169_FH_AGB_BALIZAS_HORIZONTAIS_MULTIFONTE.md
      - tools/update_spec_docx.py
permissions:
  contents: write
jobs:
  sync-word:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patches-3.26.6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V88.169 checkpoint to Word specification
        run: |
          python tools/update_spec_docx.py \
            --docx docs/ESPECIFICACAO_TECNICA_COMPLETA.docx \
            --entry docs/spec_updates/V88.169_FH_AGB_BALIZAS_HORIZONTAIS_MULTIFONTE.md \
            --baseline c12ed761295a75502dc8285ee62c80858d32b388 \
            --head-sha "$GITHUB_SHA" \
            --code-sha "$GITHUB_SHA" \
            --date 2026-11-19 \
            --footer-label V88.169 \
            --footer-date 19/11/2026 \
            --cover-state "TESTE FH→PAINEL LOCAL PASSOU; SINOP LIVE + BUILD WINDOWS PENDENTES; NÃO HOMOLOGADA" \
            --cover-version "V88.169 | 3.26.79-PRECAMPO-EXPERIMENTAL"
          cp docs/ESPECIFICACAO_TECNICA_COMPLETA.docx docs/ESPECIFICACAO_TECNICA_COMPLETA_V88_169.docx
          python -c "from zipfile import ZipFile; p='docs/ESPECIFICACAO_TECNICA_COMPLETA.docx'; z=ZipFile(p); assert z.testzip() is None"
      - name: Commit synchronized Word file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ESPECIFICACAO_TECNICA_COMPLETA.docx docs/ESPECIFICACAO_TECNICA_COMPLETA_V88_169.docx
          git commit -m "Sync V88.169 Word specification" || exit 0
          git push origin HEAD:patches-3.26.6
