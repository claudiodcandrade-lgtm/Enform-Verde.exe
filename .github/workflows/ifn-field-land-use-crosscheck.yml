name: IFN field subplots x panel UAs (non-homologating)
on:
  workflow_dispatch:
  push:
    branches: [feature/agricultural-identification-native-carbon]
    paths:
      - 'tools/audit_ifn_field_land_use.py'
      - 'tests/test_audit_ifn_field_land_use.py'
      - 'validation/ifn_field_land_use_sources.json'
      - '.github/workflows/ifn-field-land-use-crosscheck.yml'
permissions:
  contents: read
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install XLSX reader for field observation audit
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Run field-source anti-pseudoreplication regression tests
        run: python -m unittest tests.test_audit_ifn_field_land_use -v
      - name: Acquire licensed IFN panels for candidate UA join
        run: |
          python tools/acquire_ifn_independent_data.py \
            --registry validation/ifn_sources.json --out ifn_raw \
            --report ifn_panel_download_audit.json
      - name: Produce provisional physical UA candidate CSV
        run: |
          python -m tools.audit_ifn_panel_biome_coverage \
            --raw-dir ifn_raw --download-audit ifn_panel_download_audit.json \
            --report ifn_panel_biome_coverage.json \
            --candidate-csv ifn_panel_native_ua_pre_ibge_unvalidated.csv
      - name: Acquire CC BY 2025 field land-use subplots (MT, MS, PA)
        run: |
          python tools/acquire_ifn_independent_data.py \
            --registry validation/ifn_field_land_use_sources.json \
            --out ifn_field_raw --report ifn_field_download_audit.json
      - name: Cross-check physical UAs with field subplots, no carbon or SAR claims
        run: |
          python -m tools.audit_ifn_field_land_use \
            --candidate-csv ifn_panel_native_ua_pre_ibge_unvalidated.csv \
            --raw-dir ifn_field_raw --download-audit ifn_field_download_audit.json \
            --report ifn_field_land_use_crosscheck_UNVALIDATED.json
      - name: Upload audit provenance and descriptive result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ifn-field-land-use-unvalidated-${{ github.sha }}
          path: |
            ifn_panel_download_audit.json
            ifn_panel_biome_coverage.json
            ifn_field_download_audit.json
            ifn_field_land_use_crosscheck_UNVALIDATED.json
          if-no-files-found: warn
          retention-days: 30
