name: Synchronize V88.124 Word technical specification
on:
  push:
    branches:
      - feature/agricultural-identification-native-carbon
      - patches-3.26.6
    paths:
      - docs/spec_updates/V88.124_INTERFACE_RELATORIOS.md
      - .github/workflows/sync-v88-124-word.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: enform-word-spec-sync
  cancel-in-progress: false
jobs:
  update-word:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append V88.124 UI report update without replacing full Word history
        run: |
          python tools/update_spec_docx.py \
            --docx docs/ESPECIFICACAO_TECNICA_COMPLETA.docx \
            --entry docs/spec_updates/V88.124_INTERFACE_RELATORIOS.md \
            --baseline "Enform Verde 3.26.60-PRECAMPO-EXPERIMENTAL (V88.123)" \
            --head-sha "${{ github.sha }}" \
            --code-sha "$(git log -1 --format=%H -- desktop_app.py)" \
            --date "16 de novembro de 2026" \
            --footer-label "V88.124 · experimental 3.26.61 · rolagem e leitura de relatórios" \
            --footer-date "16/11/2026"
      - name: Verify Word archive and V88.124 content
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          p='docs/ESPECIFICACAO_TECNICA_COMPLETA.docx'
          with ZipFile(p) as z:
              assert z.testzip() is None
              xml=z.read('word/document.xml').decode('utf-8')
              assert len(xml)>10000
              assert 'V88.124' in xml and '3.26.61-PRECAMPO-EXPERIMENTAL' in xml
          print('Word specification updated and archive validated')
          PY
      - name: Commit Word specification to the development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add docs/ESPECIFICACAO_TECNICA_COMPLETA.docx
          git diff --cached --quiet || git commit -m "docs: synchronize Word specification V88.124"
          git push origin HEAD:${{ github.ref_name }}
