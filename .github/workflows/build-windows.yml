name: Build Enform Verde Windows
on:
  push:
    branches: [main, patches-3.26.6]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Cancel superseded PR jobs; every surviving job still checks out and verifies its exact source SHA.
  group: enform-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge refs are synthetic and NOT the branch HEAD used for release.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_desktop.txt
      - name: Resolve application version (single source - desktop_app.APP_VERSION)
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path desktop_app.py -Pattern '^APP_VERSION="([^"]+)"' | Select-Object -First 1
          if (!$line) { throw 'APP_VERSION not found in desktop_app.py' }
          $ver = $line.Matches[0].Groups[1].Value
          $num = ($ver -split '-')[0]
          if ($num -notmatch '^\d+\.\d+\.\d+$') { throw "APP_VERSION must start with MAJOR.MINOR.PATCH: $ver" }
          $notes = "APP_RELEASE_NOTES_v$num.md"
          if (!(Test-Path $notes)) { throw "Release notes $notes are required for every new version" }
          $noteTitle = Select-String -Path $notes -Pattern '^# Enform Verde v(.+)$' | Select-Object -First 1
          if (!$noteTitle -or $noteTitle.Matches[0].Groups[1].Value -ne $ver) {
            throw "Release note title/version does not match desktop_app.APP_VERSION ($ver)"
          }
          git fetch --tags --quiet origin 2>$null
          $tag = "v$ver"
          $tagged = (git rev-list -n 1 $tag 2>$null)
          $head = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($tagged -and $tagged.Trim() -ne $head) {
            $msg = "Version $ver is already published at $tagged. Increment APP_VERSION for this new build."
            if ('${{ github.event_name }}' -eq 'push') { throw $msg } else { Write-Host "::warning::$msg" }
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION_NUM=$num" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ENFORM_APP_VERSION $ver"
          # git rev-list exits 128 when the tag does not exist; that is the
          # normal case for a NEW version and must not fail the step.
          $global:LASTEXITCODE = 0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_desktop.txt
          pip install pillow
      - name: Probe official PronaSolos 0-100 cm real raster horizons
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: python tools/probe_pronasolos_100cm.py pronasolos_probe_100cm.json
      - name: Upload PronaSolos real 0-100 cm probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pronasolos-100cm-audit
          path: pronasolos_probe_100cm.json
          if-no-files-found: warn
          retention-days: 30

      - name: Materialize official PAM microregion series
        run: python tools/build_sidra_pam_microregion_series.py
      - name: Upload PAM series and provenance
        uses: actions/upload-artifact@v4
        with:
          name: pam-microregion-yield-2015-2024
          path: |
            data/pam_microregion_yield_2015_2024.csv.gz
            data/pam_microregion_yield_2015_2024.metadata.json
          retention-days: 30
      - name: Materialize IFN microdata and crosswalk to IBGE legenda_1
        timeout-minutes: 20
        run: |
          python tools/harvest_ifn_dap10_2025.py
          python tools/ingest_official_inventory_microdata.py
          python tools/build_ifn_ibge_crosswalk.py
      - name: Upload IFN database and spatial crosswalk audit
        uses: actions/upload-artifact@v4
        with:
          name: ifn-tree-microdata-and-ibge-crosswalk-${{ github.sha }}
          path: |
            data/official_inventory_microdata_ingestion_v1.json
            data/ifn_ibge_crosswalk_audit_v1.json
          retention-days: 30
      - name: Inspect public IFN necromass and point schemas
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          @'
          import requests, pandas as pd
          panel_url="https://dados.florestal.gov.br/dataset/2d579a3b-29f7-41af-b35c-8fb8f51ef819/resource/f5902766-14e3-46b8-bdc4-99bc09693161/download/dadosabertos_dadosnecromassa_painelbiomassacarbono_snif_fonte_ifn_sfb.csv"
          panel=pd.read_csv(panel_url,sep=";",encoding="utf-8-sig",dtype=str)
          print("IFN_PANEL_LIVE",len(panel),list(panel.columns),panel.head(2).to_dict("records"))
          # SFB's current public point service (2026-07); retain real plot coordinates
          # and official fields used to join IFN observations to biome/state metadata.
          endpoint="https://smapas.florestal.gov.br/server/rest/services/Hosted/Pontos_IFN_2026_07_shp/FeatureServer/0/query"
          params={"where":"1=1","outFields":"no_conglom,nm_bioma,sigla_uf,lat,long,co_lote,no_lote",
                  "returnGeometry":"true","outSR":"4326","f":"json","resultRecordCount":3}
          r=requests.get(endpoint,params=params,timeout=45)
          r.raise_for_status(); js=r.json()
          if js.get("error"): raise RuntimeError(f"IFN point service error: {js['error']}")
          features=js.get("features",[])
          print("IFN_POINTS_LIVE",js.get("fields"),features[:2])
          assert panel.shape[0]>0 and features, "official IFN observations and point geometry required"
          attrs=features[0].get("attributes",{})
          assert all(attrs.get(k) is not None for k in ("no_conglom","nm_bioma","sigla_uf")), "IFN point metadata is incomplete"
          assert features[0].get("geometry"), "IFN point geometry is required for spatial matching"
          '@ | Set-Content inspect_ifn_live.py -Encoding UTF8
          python inspect_ifn_live.py
      - name: Diagnose 2010 L-band H100 at Tapajos ORNL plots
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 12
        run: python tools/diagnose_tapajos_2010_height.py
      - name: Upload 2010 H100 diagnostic report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tapajos-2010-height-diagnostic-${{ github.run_number }}
          path: tapajos_2010_h100_diagnostic.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate national SAR and reference source catalog
        run: python tools/validate_sar_source_catalog.py

      - name: Source self-test
        run: python desktop_app.py --self-test
      - name: IFN database, location, biome and fitophysiognomy selection tests
        run: python -m unittest tests.test_inventory_microdata_library -v
      - name: Native-only stratification and confidence regression tests
        run: python -m unittest tests.test_native_carbon tests.test_land_use_sar tests.test_crop_model_registry tests.test_crop_yield_uncertainty tests.test_crop_yield_modeling tests.test_crop_map_training tests.test_crop_height_features tests.test_crop_regional_phenology tests.test_crop_fusion_inference tests.test_crop_fusion_batch tests.test_sar_acquisition_time tests.test_planted_forest_classifier tests.test_independent_sar_validation tests.test_external_reference_catalog tests.test_alos_scene_pair tests.test_integrated_system_classifier tests.test_executive_carbon_report tests.test_inmet_weather_client tests.test_sidra_pam_materializer tests.test_sar_crop_domain_policy tests.test_agricultural_sar_freshness tests.test_agricultural_evidence_routes tests.test_dual_dashboard tests.test_agricultural_yield_units -v
      - name: Pantanal fallback tests
        run: python -m unittest tests.test_pantanal_fallback -v
      - name: Earthdata client import
        run: python -c "import earthaccess; print('EARTHACCESS_IMPORT_OK', earthaccess.__version__)"
      - name: GUI contract test
        shell: pwsh
        timeout-minutes: 3
        run: |
          @'
          import tkinter as tk
          from pathlib import Path
