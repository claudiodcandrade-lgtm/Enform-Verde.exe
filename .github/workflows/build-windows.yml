        shell: pwsh
        run: |
          $src = Join-Path $PWD 'dist\Enform Verde'
          $dst = Join-Path $env:RUNNER_TEMP 'Enform Verde Clean Test'
          Copy-Item -Path $src -Destination $dst -Recurse
          $fixture = Join-Path $dst 'acceptance'
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Copy-Item 'acceptance\Teste_SAR_Biomassa_Tapajos.kmz' (Join-Path $fixture 'Teste_SAR_Biomassa_Tapajos.kmz') -Force
          $exe = Join-Path $dst 'Enform Verde.exe'
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $ui = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -WorkingDirectory $dst -PassThru -Wait
            if ($ui.ExitCode -ne 0) { throw "Compiled EXE UI smoke test failed: $($ui.ExitCode)" }
            $mc = Start-Process -FilePath $exe -ArgumentList '--module-check' -WorkingDirectory $dst -PassThru -Wait
            if ($mc.ExitCode -ne 0) {
              $log = Join-Path $env:TEMP 'enform_verde_module_check_error.txt'
              if (Test-Path $log) { Get-Content $log }
              throw "Compiled EXE module/data check failed: $($mc.ExitCode)"
            }
            Get-Content (Join-Path $env:TEMP 'enform_verde_module_check.json')
            # The same observed test input must return the same results under
            # Python and the PyInstaller Windows executable, not just import.
            $pythonRef = Get-Content (Join-Path $env:RUNNER_TEMP 'enform_python_reference.json') -Raw | ConvertFrom-Json -AsHashtable
            $windowsResult = Get-Content (Join-Path $env:TEMP 'enform_verde_module_check.json') -Raw | ConvertFrom-Json -AsHashtable
            foreach ($key in @('version','soil_exact_intersection','pre_field_model_contract','microregion','pam_years','yield_panel_model','sar_model','crop_water','ifn_microdata')) {
              if (!$pythonRef.ContainsKey($key) -or !$windowsResult.ContainsKey($key)) { throw "Python/Windows parity missing module evidence: $key" }
              $left = ConvertTo-Json -InputObject $pythonRef[$key] -Depth 30 -Compress
              $right = ConvertTo-Json -InputObject $windowsResult[$key] -Depth 30 -Compress
              if ($left -ne $right) { throw "Python/Windows parity differs for $key : Python=$left Windows=$right" }
            }
            Write-Host 'PYTHON_WINDOWS_CORE_MODULE_PARITY_OK'
            $vc = Start-Process -FilePath $exe -ArgumentList '--visual-check' -WorkingDirectory $dst -PassThru -Wait
            if ($vc.ExitCode -ne 0) {
              foreach ($f in 'enform_verde_visual_check.txt','enform_verde_visual_check_error.txt') {
                $log = Join-Path $env:TEMP $f; if (Test-Path $log) { Get-Content $log } }
              throw "Compiled EXE changed the approved visual standard: $($vc.ExitCode)"
            }
            Get-Content (Join-Path $env:TEMP 'enform_verde_visual_check.txt')
            # V87.39: LIVE proof in the compiled EXE that real CBERS-4A and
            # Sentinel-1 RTC pixels are readable with TLS verification ON.
            $nc = Start-Process -FilePath $exe -ArgumentList '--network-check' -WorkingDirectory $dst -PassThru -Wait
            Get-Content (Join-Path $env:TEMP 'enform_verde_network_check.json') -ErrorAction SilentlyContinue
            if ($nc.ExitCode -ne 0) {
              $log = Join-Path $env:TEMP 'enform_verde_network_check_error.txt'
              if (Test-Path $log) { Get-Content $log }
              throw "Compiled EXE could not read real CBERS-4A / Sentinel-1 pixels: $($nc.ExitCode)"
            }
            $p = Start-Process -FilePath $exe -ArgumentList @('--acceptance-test','acceptance\Teste_SAR_Biomassa_Tapajos.kmz') -WorkingDirectory $dst -PassThru -Wait
            if ($p.ExitCode -ne 0) {
              $log = Join-Path $env:TEMP 'enform_verde_acceptance_error.txt'
              if (Test-Path $log) { Get-Content $log }
              throw "Compiled EXE Tapajos SAR/AOI acceptance failed: $($p.ExitCode)"
            }
            $result = Join-Path $env:TEMP 'enform_verde_acceptance_result.json'
            if (!(Test-Path $result)) { throw 'Compiled EXE did not produce its acceptance summary' }
            Get-Content $result
          }
          finally { $env:PATH = $oldPath }
      - name: Record tested Windows EXE source SHA and checksum
        shell: pwsh
        run: |
          # This step is reached only after the clean-folder EXE smoke tests.
          $folder = Join-Path $PWD 'dist\Enform Verde'
          $exe = Join-Path $folder 'Enform Verde.exe'
          if (!(Test-Path $exe)) { throw 'Cannot checksum missing compiled executable' }
          $sourceSha = (git rev-parse HEAD).Trim()
          $expectedSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($sourceSha -ne $expectedSha) {
            throw "Windows package SHA is not the requested branch HEAD: checked out $sourceSha; expected $expectedSha; event SHA $env:GITHUB_SHA"
          }
          $checksum = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          $manifest = @(
            'Enform Verde Multisource — Windows build audit',
            "Application version: $env:APP_VERSION",
            "Git commit of checked-out source: $sourceSha",
            "Expected source SHA from branch/PR: $expectedSha",
            "Workflow run ID: $env:GITHUB_RUN_ID",
            'Clean-folder EXE UI smoke and Tapajos AOI acceptance: passed before manifest generation',
            "SHA256 Enform Verde.exe: $checksum",
            'Scientific validation status: NOT HOMOLOGATED until independent SAR, crop, all-pool uncertainty and five-biome criteria pass',
            'Artifact ZIP archive digest is separately reported by GitHub Actions after upload'
          )
          $manifest | Set-Content -Path (Join-Path $folder 'BUILD-MANIFEST.txt') -Encoding UTF8
          Write-Host "WINDOWS_EXE_SOURCE_SHA $sourceSha"
          Write-Host "WINDOWS_EXE_SHA256 $checksum"
          Write-Host "WINDOWS_EXE_VERSION $env:APP_VERSION"
      - name: Add instructions
        shell: pwsh
        run: |
          @'
          ENFORM VERDE - WINDOWS
          Notas desta versão: NOTAS_DA_VERSAO.md. Pixels SAR e AGB quantitativa ALOS-PALSAR foram testados no Cerrado; a busca automática de BIOMASS deve ser verificada por AOI e não implica cobertura universal. Para Tapajós, altura H100 e AGB derivada de SAR continuam NÃO VALIDADAS; a referência microrregional, quando apresentada, é literatura e nunca é AGB SAR.
          NOVO: carbono apenas em formações nativas, calculado separadamente por fitofisionomia e área de interseção; outros usos são apenas indicados. Identificadores SAR instalados são procurados automaticamente em %USERPROFILE%\.enform_verde\modelos_sar\ativo.json (e demais JSON) ou conforme ENFORM_LAND_USE_SAR_CONFIG / ENFORM_SAR_MODELS_DIR; configuração manual permanece opcional. PRIORIDADE: classificador SAR executável e avaliado independentemente para classes atuais; MapBiomas pode aparecer apenas em campo histórico separado, nunca como fallback, classificação atual, máscara de cultivos, vigor ou previsão. IBGE apenas nomeia fitofisionomias de vegetação nativa detectada por SAR validado. Sem classificador SAR semântico validado, mostrar unidades SAR experimentais sem classe ou N/D — jamais substituir por MapBiomas. Nenhum modelo treinado para todo o Brasil vem embutido. Modelos internacionais, teses e dissertações são fontes admissíveis com qualquer acurácia mensurada/publicada, divulgando métrica, domínio e incerteza; a acurácia estrangeira não é validação nesta AOI. O código de modelos publicado sem pesos/dados/inferência executáveis permanece bibliografia. Ver docs/CLASSIFICACAO_SAR_USO_SOLO.md e docs/MODELOS_SAR_AGRICULTURA_INTERNACIONAL_2026-10-28.md.
          Para abrir: dê duplo clique em "Enform Verde.exe".
          Não é necessário instalar Python. Mantenha o EXE e a pasta _internal juntos.
          IMPORTANTE: extraia TODO o ZIP antes de abrir. Não execute o EXE de dentro do ZIP.
          A análise espacial aceita vetor local e tenta consulta pública do SICAR, SIGEF e Embrapa quando houver internet.
          O pacote inclui acceptance\Teste_SAR_Cerrado_DF.kmz (baixa biomassa) e acceptance\Teste_SAR_Alta_Biomassa_Tapajos.kml (AOI candidata de alta biomassa; requer modelo AGB SAR compatível, não aceitar fallback bibliográfico como resultado SAR).
          MONITORAMENTO SAR NACIONAL: experimental, sem garantia de leitura recente em toda coordenada/data do Brasil. Consulte DIAGNOSTICO_SAR_NACIONAL.json para os resultados por amostra e por provedor; cada AOI sem par VV/VH legível deve permanecer N/D/ERRO. Esta versão não está homologada.
          '@ | Set-Content 'dist\Enform Verde\LEIA-ME.txt' -Encoding UTF8
          if (Test-Path 'inpe_sentinel1_rtc_live.json') { Copy-Item 'inpe_sentinel1_rtc_live.json' 'dist\Enform Verde\DIAGNOSTICO_SAR_NACIONAL.json' }
          if (Test-Path 'national_sar_gate_status.txt') { Copy-Item 'national_sar_gate_status.txt' 'dist\Enform Verde\STATUS_GATE_SAR_NACIONAL.txt' }
          $body = Get-Content 'dist\Enform Verde\LEIA-ME.txt' -Raw
          ("VERSÃO $env:APP_VERSION`r`n" + $body) | Set-Content 'dist\Enform Verde\LEIA-ME.txt' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Enform-Verde-Windows-v${{ env.APP_VERSION }}
          path: dist/Enform Verde/
          if-no-files-found: error
          retention-days: 90
    outputs:
      app_version: ${{ steps.version.outputs.version }}

  publish-release:
    # Every new version merged to main (or dispatched manually) becomes a
    # permanent GitHub Release with the SAME tested package. PR builds only
    # produce the 90-day artifact.
    needs: build-windows
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Enform-Verde-Windows-v${{ needs.build-windows.outputs.app_version }}
          path: release_asset
      - name: Package ZIP and checksum
        run: |
          VER="${{ needs.build-windows.outputs.app_version }}"
          ASSET="Enform-Verde-Windows-v${VER}.zip"
          (cd release_asset && zip -qr "../${ASSET}" .)
          sha256sum "${ASSET}" | tee "${ASSET}.sha256"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "VER=${VER}" >> "$GITHUB_ENV"
      - name: Publish permanent release (never overwrite another commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VER}"
          NUM="${VER%%-*}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            TARGET=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || true)
            if [ -n "$TARGET" ] && [ "$TARGET" != "${{ github.sha }}" ]; then
              echo "::error::Release ${TAG} already exists for ${TARGET}; increment APP_VERSION"; exit 1
            fi
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "Enform Verde ${VER}" \
              --notes-file "APP_RELEASE_NOTES_v${NUM}.md" --prerelease
          fi

  maap-real-fh-proof:
    name: ESA BIOMASS FH real-data proof (separate from Windows)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESA_MAAP_OFFLINE_TOKEN: ${{ secrets.ESA_MAAP_OFFLINE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BIOMASS live dependencies
        run: pip install requests geopandas rasterio shapely numpy
      - name: Download and read actual ESA BIOMASS FH pixels at Sinop
        id: sinop_fh
        shell: bash
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          python tools/verify_esa_maap_live.py --bbox -55.21 -11.89 -55.17 -11.85 --download | tee maap_sinop_probe.jsonl
      - name: Global pixel proof fallback — official ESA STAC Borneo example
        if: ${{ steps.sinop_fh.outcome == 'failure' }}
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          python tools/verify_esa_maap_live.py --bbox 108.0 -4.66 119.0 8.05 --download | tee maap_borneo_real_pixels.jsonl
      - name: Preserve safe ESA MAAP probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maap-fh-real-pixel-proof-${{ github.run_number }}
          path: |
            maap_sinop_probe.jsonl
            maap_borneo_real_pixels.jsonl
