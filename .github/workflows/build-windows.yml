          assert "self.after(100,start_weather_if_current)" in src and "has_cultivated_area(classes)" in src, "automatic weather query for mapped crop area missing"
          assert "generation==self._weather_query_generation" in src and "analysis_id==self.project.get(\"analysis_run_id\")" in src, "stale weather response guard missing"
          assert "ATUALIZAR PAINEL METEOROLÓGICO" in src and "INMET" in src and "BDMEP histórico" in src, "executive weather panel/source provenance missing"
          assert "Painel executivo" in src and "Auditoria técnica" in src and "self.crop_audit" in src, "executive summary and audit trail must use separate views"
          reset=src[src.index("def _reset_analysis_state"):src.index("def clear_research")]
          assert "self.crop_audit" in reset and "self.crop_res" in reset, "new research must clear both executive results and audit details"
          assert "CLIMATEMPO" not in weather_sources, "unlicensed Climatempo source must be absent"
          from agricultural_native_policy import has_cultivated_area
          assert has_cultivated_area([{"class_name":"Áreas cultivadas","area_ha":1.0}])
          assert has_cultivated_area([{"class_name":"Soja","area_ha":1.0}])
          assert not has_cultivated_area([{"class_name":"Pastagem","area_ha":1.0}]), "pasture must not trigger crop-weather forecast panel"
          assert "cod_imovel" in src and "sicar:sicar_imoveis_" in src, "SICAR WFS contract missing"
          assert "DEFAULT@SECLEVEL=1" in src, "SICAR TLS compatibility missing"
          assert "state=\"readonly\"" not in src[src.index("def _project"):src.index("def _spatial")], "manual biome selector still present"
          assert "CCIR — código INCRA/SNCR" in src, "CCIR opening input missing"
          assert "CARREGAR ARQUIVO VETORIAL" in src[src.index("def _project"):src.index("def _spatial")], "opening vector upload missing"
          assert "Buscar CAR no SICAR" not in src and "Buscar CCIR no SIGEF" not in src, "manual registry lookup buttons must be absent"
