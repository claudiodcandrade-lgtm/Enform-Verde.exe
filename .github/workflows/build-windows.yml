      - name: Quantitative low-biomass L-band model contract
        shell: pwsh
        run: |
          @'
          import math
          import sar_pipeline as s
          A,B,C,alpha=0.016429,0.11013,0.0,0.2675
          target=20.0
          sigma=A*(target**alpha)*(1-math.exp(-B*target))+C
          db=10*math.log10(sigma)
          r=s.yu_saatchi_tropical_shrubland_agb([{"polarization":"HV","mean_db":db,"sd_db":0.5,"scene":"synthetic"}],"Cerrado","Savana Arborizada")
          assert r and abs(r["agb_mg_ha"]-target)<0.05, r
          assert r["data_origin"].startswith("SAR_L_PALSAR")
          print("YU_SAATCHI_INVERSION_OK",r["agb_mg_ha"],db)
          '@ | Set-Content yu_saatchi_contract.py -Encoding UTF8
