          assert "Carregar KML / GeoJSON" not in src[src.index("def _spatial"):src.index("def _remote")], "old vector upload still present"
          assert "def _reset_analysis_state" in src, "state reset missing"
          assert "def clear_research" in src and 'text="APAGAR PESQUISA"' in src, "clear research action missing"
          assert "def _bind_text_scroll" in src and 'bind("<MouseWheel>",wheel)' in src, "report wheel-scroll support missing"
          assert "run_id!=self._analysis_generation" in src and "analysis_run_id" in src, "stale async result guard/run identity missing"
          assert src.count("self._reset_analysis_state()") >= 3, "CAR CCIR vector reset hooks missing"
          assert "self.project.pop(k,None)" in src, "execution result invalidation missing"
          assert "active_input_id" in src and "current_car" in src, "fresh-input identity guard missing"
          assert "self.active_source=None; self.active_input_id=None" in src, "startup query state not initialized"
          assert "Bioma e fitofisionomia não são entradas" not in src, "obsolete opening notice still present"
          assert "Erro/incerteza" in src and "Nível estatístico" in src, "statistical uncertainty output missing"; assert "mean_tc_ha" in open("native_carbon.py",encoding="utf-8").read() and "range_tc_ha" in open("native_carbon.py",encoding="utf-8").read(), "native no-AGB report must preserve direct carbon-stock intervals"; assert "threading.Thread" in src and "_poll_analysis" in src, "async analysis worker missing"; assert "0–100 cm" in src and "pronasolos_soc_profiles" in src, "PronaSolos 0–100 cm SOC missing"; assert "layer_ids=[2,3,4,5,6]" in src, "PronaSolos must only request horizons through 100 cm"; assert "sicar:sicar_imoveis_" in src and "2.0.0" in src, "CAR WFS fallback missing"; assert "SAR_L_DISPONIVEL_CREDENCIAL_NECESSARIA" not in open("sar_pipeline.py",encoding="utf-8").read(), "L-band catalogue must not block analysis"
          assert "enform_header.png" in src and "Approved high-resolution Enform mask" in src, "approved high-resolution mask missing"
          header_block=src[src.index('visual=base/"enform_header.png"'):src.index("# Global action bar")]
          assert 'header.create_text(34,55,text="enform"' not in header_block and '3.15.0-MULTISOURCE' not in header_block, "duplicate branding/version overlay regression"
