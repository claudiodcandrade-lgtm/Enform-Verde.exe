    outputs:
      app_version: ${{ steps.version.outputs.version }}

  publish-release:
    # Every new version merged to main (or dispatched manually) becomes a
    # permanent GitHub Release with the SAME tested package. PR builds only
    # produce the 90-day artifact.
    needs: build-windows
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Enform-Verde-Windows-v${{ needs.build-windows.outputs.app_version }}
          path: release_asset
      - name: Package ZIP and checksum
        run: |
          VER="${{ needs.build-windows.outputs.app_version }}"
          ASSET="Enform-Verde-Windows-v${VER}.zip"
          (cd release_asset && zip -qr "../${ASSET}" .)
          sha256sum "${ASSET}" | tee "${ASSET}.sha256"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "VER=${VER}" >> "$GITHUB_ENV"
      - name: Publish permanent release (never overwrite another commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VER}"
          NUM="${VER%%-*}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            TARGET=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || true)
            if [ -n "$TARGET" ] && [ "$TARGET" != "${{ github.sha }}" ]; then
              echo "::error::Release ${TAG} already exists for ${TARGET}; increment APP_VERSION"; exit 1
            fi
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "Enform Verde ${VER}" \
              --notes-file "APP_RELEASE_NOTES_v${NUM}.md" --prerelease
          fi
