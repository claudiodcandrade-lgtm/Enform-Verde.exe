      - name: Verify ESA CCI v7 2024 Brazilian tiles are published
        shell: pwsh
        run: |
          @'
          import time
          import requests
          roots=[
            "https://data.ceda.ac.uk/neodc/esacci/biomass/data/agb/maps/v7.0/geotiff/2024",
            "https://dap.ceda.ac.uk/neodc/esacci/biomass/data/agb/maps/v7.0/geotiff/2024",
          ]
          files=[
            "N00W060_ESACCI-BIOMASS-L4-AGB-MERGED-100m-2024-fv7.0.tif",
            "N00W060_ESACCI-BIOMASS-L4-AGB_SD-MERGED-100m-2024-fv7.0.tif",
            "S10W050_ESACCI-BIOMASS-L4-AGB-MERGED-100m-2024-fv7.0.tif",
            "S10W050_ESACCI-BIOMASS-L4-AGB_SD-MERGED-100m-2024-fv7.0.tif",
          ]
          upstream_unavailable=[]
          for name in files:
              ok=False; responses=[]
              for base in roots:
                  u=base+"/"+name
                  for attempt in range(3):
                      try:
                          r=requests.get(u,headers={"Range":"bytes=0-0"},timeout=(10,60),stream=True)
                          status=r.status_code
                          detail=r.headers.get("Content-Range") or r.headers.get("Content-Length")
                          r.close()
                          responses.append((status,u))
                          if status in (200,206):
                              print("CCI_V7_ASSET_OK",name,status,detail); ok=True; break
                          if status>=500:
                              time.sleep(2**attempt); continue
                          break
                      except requests.RequestException as e:
                          responses.append((type(e).__name__,u)); time.sleep(2**attempt)
                  if ok: break
              if not ok:
                  if all(not isinstance(status,int) or status>=500 for status,_ in responses):
                      upstream_unavailable.append((name,responses))
                      print("CCI_V7_UPSTREAM_TEMPORARILY_UNAVAILABLE",name,responses)
                  else:
                      raise RuntimeError(f"CCI v7 asset missing or denied: {name} {responses}")
          if upstream_unavailable:
              print("CCI_V7_LIVE_CHECK_DEFERRED: official endpoints returned only transient service errors; local contract tests still run")
          '@ | Set-Content cci_live_contract.py -Encoding UTF8
          python cci_live_contract.py

      - name: Probe live BIOMASS FH coverage over inventory-supported Tapajos AOIs
        id: biomass_fh_gate
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import geopandas as gpd
          import requests
          from shapely.geometry import box
          import sar_pipeline as s
          aois={
            "PF_HIGH_8_11":box(-54.9804,-2.9399,-54.9785,-2.9336),
            "SF_LOW_21_23":box(-54.9842,-3.1151,-54.9828,-3.1109),
          }
          for name,geom in aois.items():
              g=gpd.GeoDataFrame(geometry=[geom],crs="EPSG:4326")
              items,height_audit=s.biomass_l2b_search(g,limit=100,return_audit=True)
              fh_l2a=[x for x in items if x.get("_product_type")=="FP_FH__L2A"]
              fh_l2b=[x for x in items if x.get("_product_type")=="FP_FH__L2B"]
              agb=[x for x in items if x.get("_product_type")=="FP_AGB_L2B"]
              print("BIOMASS_COVERAGE_PROBE",name,
                    "FH_L2A",len(fh_l2a),"FH_L2B",len(fh_l2b),
                    "AGB_L2B",len(agb),
                    "HEIGHT_QUERIES_COMPLETE",height_audit.get("height_queries_complete"))
              l1=[]
              l1_audit={"catalog_search_complete":False,"pagination_complete":False}
              try:
                  l1,l1_audit=s.maap_search(g,"BiomassLevel1c",limit=1000,return_audit=True)
                  ids=[str(x.get("id") or "") for x in l1]
                  import re
                  cycles=sorted({m.group(1) for ident in ids for m in [re.search(r"_C(\d+)_",ident)] if m})
                  tracks=sorted({m.group(1) for ident in ids for m in [re.search(r"_T(\d+)_F(\d+)",ident)] if m})
                  print("BIOMASS_L1C_COVERAGE",name,"items",len(l1),"cycles",cycles,"track_frames",tracks)
                  for x in l1:
                      p=x.get("properties") or {}
                      assets=x.get("assets") or {}
                      print("BIOMASS_L1C_ITEM",name,x.get("id"),p.get("datetime") or p.get("start_datetime"),p.get("end_datetime"),"assets",list(assets))
                  if l1:
                      # Probe only real BIOMASS measurement assets, never XML schemas or quicklook imagery.
                      tested=set()
                      for x in l1:
                          ident=str(x.get("id") or "")
                          m=re.search(r"_(T\d+_F\d+)_",ident)
                          orbit_frame=m.group(1) if m else "unknown_track_frame"
                          for key,a in (x.get("assets") or {}).items():
                              k=key.lower()
                              if not any(token in k for token in ("enclosure_i_phase_tiff","enclosure_i_abs_tiff","enclosure_nc")):
                                  continue
                              if (orbit_frame,key) in tested:
                                  continue
                              tested.add((orbit_frame,key))
                              href=a.get("href")
                              if not href:
                                  print("BIOMASS_L1C_ASSET_ACCESS_ERROR",name,key,"missing_href")
                                  continue
                              try:
                                  q=requests.get(href,headers={"Range":"bytes=0-0"},stream=True,timeout=(10,30))
                                  print("BIOMASS_L1C_ASSET_ACCESS",name,orbit_frame,key,q.status_code,q.headers.get("Content-Range") or q.headers.get("Content-Length"))
                                  q.close()
                              except Exception as ae:
                                  print("BIOMASS_L1C_ASSET_ACCESS_ERROR",name,orbit_frame,key,type(ae).__name__,str(ae)[:180])
                              if len(tested)>=4:
                                  break
                          if len(tested)>=4:
                              break
              except Exception as e:
                  print("BIOMASS_L1C_QUERY_ERROR",name,type(e).__name__,str(e)[:240])
              for x in (fh_l2a+fh_l2b)[:3]:
                  print("FH_ITEM",name,x.get("id"),x.get("_stage"),x.get("_collection"))
              if fh_l2a or fh_l2b:
                  route_status="FH_PRODUCT_FOUND; PIXEL_READ_STILL_REQUIRED"
              elif not height_audit.get("height_queries_complete"):
                  route_status="FH_CATALOG_SEARCH_INCOMPLETE; ABSENCE_NOT_PROVEN"
              elif l1:
                  route_status="L1C_SCENES_PRESENT_BUT_NO_L2_FH_FOUND; PROCESSING_ROUTE_UNRESOLVED"
              elif not (l1_audit.get("catalog_search_complete") and l1_audit.get("pagination_complete")):
                  route_status="L1C_CATALOG_SEARCH_INCOMPLETE; ABSENCE_NOT_PROVEN"
              else:
                  route_status="NO_FH_L2_OR_L1C_IN_SEARCHED_CATALOGS; OTHER_HEIGHT_ROUTES_STILL_REQUIRED"
              print("BIOMASS_HEIGHT_ROUTE_STATUS",name,route_status)
          '@ | Set-Content biomass_fh_probe.py -Encoding UTF8
          python biomass_fh_probe.py

