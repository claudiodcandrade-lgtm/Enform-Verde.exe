      - name: Record tested Windows EXE source SHA and checksum
        shell: pwsh
        run: |
          # This step is reached only after the clean-folder EXE smoke tests.
          $folder = Join-Path $PWD 'dist\Enform Verde'
          $exe = Join-Path $folder 'Enform Verde.exe'
          if (!(Test-Path $exe)) { throw 'Cannot checksum missing compiled executable' }
          $sourceSha = (git rev-parse HEAD).Trim()
          $expectedSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($sourceSha -ne $expectedSha) {
