name: Build Enform Verde Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_desktop.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_desktop.txt
          pip install pillow
      - name: Build offline Brazil satellite basemap — NASA Blue Marble
        shell: pwsh
        timeout-minutes: 8
        run: |
          $b1='https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography-bathymetry/january/world.topo.bathy.200401.3x21600x21600.B1.jpg'
          $b2='https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography-bathymetry/january/world.topo.bathy.200401.3x21600x21600.B2.jpg'
          Invoke-WebRequest -Uri $b1 -OutFile nasa_b1.jpg
          Invoke-WebRequest -Uri $b2 -OutFile nasa_b2.jpg
          @'
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None  # fixed, trusted NASA BMNG source tiles
          # NASA BMNG 500 m tile extents:
          # B1 = 90N..0, 90W..0; B2 = 0..90S, 90W..0; 240 px/degree.
          W,E,N,S=-75.0,-33.0,6.0,-35.0
          px=240.0
          x0=round((W+90.0)*px); x1=round((E+90.0)*px)
          b1=Image.open("nasa_b1.jpg").convert("RGB")
          b2=Image.open("nasa_b2.jpg").convert("RGB")
          y1a=round((90.0-N)*px); y1b=round(90.0*px)
          y2a=0; y2b=round((0.0-S)*px)
          north=b1.crop((x0,y1a,x1,y1b))
          south=b2.crop((x0,y2a,x1,y2b))
          out=Image.new("RGB",(north.width,north.height+south.height))
          out.paste(north,(0,0)); out.paste(south,(0,north.height))
          # 1 km-class offline background: compact enough to ship, detailed enough for national/regional context.
          out=out.resize((out.width//2,out.height//2),Image.Resampling.LANCZOS)
          out.save("offline_brazil_basemap.jpg","JPEG",quality=88,optimize=True,progressive=True)
          assert out.width>=5000 and out.height>=4900
          print("OFFLINE_BRAZIL_BASEMAP_OK",out.size)
          '@ | Set-Content make_offline_basemap.py -Encoding UTF8
          python make_offline_basemap.py
          Get-Item offline_brazil_basemap.jpg | Format-List Name,Length

      - name: Build offline IBGE administrative and infrastructure map
        shell: pwsh
        timeout-minutes: 15
        run: |
          @'
          import io, json, gzip, zipfile, urllib.request, tempfile, os, re, shutil
          from pathlib import Path
          import geopandas as gpd
          from shapely.geometry import mapping

          work=Path("ibge_offline_build"); work.mkdir(exist_ok=True)
          mun_url="https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2025/Brasil/BR_Municipios_2025.zip"
          bc_url="https://geoftp.ibge.gov.br/cartas_e_mapas/bases_cartograficas_continuas/bc250/versao2025/shapefiles/bc_250_shapefiles_2026_03_03.zip"

          def download(url,path):
              if path.exists(): return
              req=urllib.request.Request(url,headers={"User-Agent":"Enform-Verde-build"})
              with urllib.request.urlopen(req,timeout=180) as r, open(path,"wb") as f:
                  shutil.copyfileobj(r,f,length=8*1024*1024)

          mun_zip=work/"municipios.zip"; bc_zip=work/"bc250.zip"
          download(mun_url,mun_zip); download(bc_url,bc_zip)

          def extract_matching(zpath,tokens,outdir):
              outdir.mkdir(parents=True,exist_ok=True)
              stems=set()
              with zipfile.ZipFile(zpath) as z:
                  for n in z.namelist():
                      base=Path(n).name.lower()
                      if base.endswith(".shp") and any(t in base for t in tokens):
                          stems.add(Path(n).with_suffix("").as_posix())
                  for stem in stems:
                      for ext in (".shp",".shx",".dbf",".prj",".cpg"):
                          target_name=stem+ext
                          names={n.lower():n for n in z.namelist()}
                          real=names.get(target_name.lower())
                          if real:
                              target=outdir/Path(real).name
                              with z.open(real) as src, open(target,"wb") as dst: shutil.copyfileobj(src,dst)
              return sorted(outdir.glob("*.shp"))

          # Municipal polygons
          mun_dir=work/"mun"
          with zipfile.ZipFile(mun_zip) as z:z.extractall(mun_dir)
          mun_shp=next(mun_dir.rglob("*Municipios*.shp"))
          mun=gpd.read_file(mun_shp).to_crs(4326)
          name_col=next((c for c in mun.columns if c.upper() in ("NM_MUN","NM_MUNICIP","NOME")),None)
          code_col=next((c for c in mun.columns if c.upper() in ("CD_MUN","CD_GEOCMU","GEOCODIGO")),None)
          mun["geometry"]=mun.geometry.simplify(0.004,preserve_topology=True)

          uf_map={"11":"RO","12":"AC","13":"AM","14":"RR","15":"PA","16":"AP","17":"TO","21":"MA","22":"PI","23":"CE","24":"RN","25":"PB","26":"PE","27":"AL","28":"SE","29":"BA","31":"MG","32":"ES","33":"RJ","35":"SP","41":"PR","42":"SC","43":"RS","50":"MS","51":"MT","52":"GO","53":"DF"}
          features={"ufs":[],"municipios":[],"rodovias":[],"ferrovias":[],"hidrovias":[],"drenagem":[],"aeroportos":[],"portos":[],"localidades":[]}

          def add_feat(layer,geom,props=None):
              if geom is None or geom.is_empty:return
              b=list(map(float,geom.bounds))
              features[layer].append({"bbox":b,"properties":props or {},"geometry":mapping(geom)})

          for _,r in mun.iterrows():
              geom=r.geometry
              rp=geom.representative_point()
              nm=str(r.get(name_col,"")) if name_col else ""
              cd=str(r.get(code_col,"")) if code_col else ""
              add_feat("municipios",geom,{"name":nm,"code":cd,"label":[float(rp.x),float(rp.y)]})

          if code_col:
              tmp=mun.copy(); tmp["UFKEY"]=tmp[code_col].astype(str).str[:2]
              for uf,grp in tmp.groupby("UFKEY"):
                  geom=grp.geometry.union_all().simplify(0.008,preserve_topology=True)
                  rp=geom.representative_point()
                  add_feat("ufs",geom,{"sigla":uf_map.get(str(uf),str(uf)),"name":uf_map.get(str(uf),str(uf)),"label":[float(rp.x),float(rp.y)]})

          # BC250 selected national infrastructure layers
          specs={
            "rodovias":["trecho_rodoviario","rodovia"],
            "ferrovias":["trecho_ferroviario","ferrovia"],
            "hidrovias":["trecho_hidroviario","hidrovia"],
            "drenagem":["trecho_drenagem"],
            "aeroportos":["pista_ponto_pouso","aerodromo","aeroporto","constr_aeroport"],
            "portos":["atracadouro","constr_portuaria","porto"],
            "localidades":["localidade","cidade_p","capital_p","vila_p"]
          }
          for layer,tokens in specs.items():
              shpfiles=extract_matching(bc_zip,tokens,work/("bc_"+layer))
              for shp in shpfiles:
                  try:gdf=gpd.read_file(shp).to_crs(4326)
                  except Exception:continue
                  name_candidates=[c for c in gdf.columns if c.upper() in ("NM_LOCALIDADE","NM_MUNICIP","NOME","NM_NOME","NOME_GEO","NM_GEOGRAF")]
                  ncol=name_candidates[0] if name_candidates else None
                  if layer not in ("aeroportos","localidades"):
                      gdf["geometry"]=gdf.geometry.simplify(0.0025,preserve_topology=True)
                  for _,r in gdf.iterrows():
                      geom=r.geometry
                      if geom is None or geom.is_empty:continue
                      props={}
                      if ncol and r.get(ncol) is not None:props["name"]=str(r.get(ncol))
                      add_feat(layer,geom,props)

          # Hard contract: essential layers must exist; infrastructure may vary in exact filename but roads/localities must resolve.
          assert len(features["ufs"])>=27, len(features["ufs"])
          assert len(features["municipios"])>=5569, len(features["municipios"])
          assert len(features["rodovias"])>0, "BC250 road layer not found"
          assert len(features["ferrovias"])>0, "BC250 railway layer not found"
          assert len(features["hidrovias"])>0, "BC250 waterway layer not found"
          assert len(features["drenagem"])>0, "BC250 drainage layer not found"
          assert len(features["aeroportos"])+len(features["portos"])>0, "BC250 airport/port infrastructure not found"
          assert len(features["localidades"])>0, "BC250 locality layer not found"

          payload={"source":{
              "municipios":"IBGE Malha Municipal Digital 2025",
              "infraestrutura":"IBGE Base Cartografica Continua do Brasil 1:250.000, versao 2025",
              "crs":"EPSG:4326"},
              "layers":features}
          with gzip.open("offline_ibge_map.json.gz","wt",encoding="utf-8",compresslevel=9) as f:
              json.dump(payload["layers"],f,ensure_ascii=False,separators=(",",":"))
          print("OFFLINE_IBGE_MAP_OK",{k:len(v) for k,v in features.items()},Path("offline_ibge_map.json.gz").stat().st_size)
          '@ | Set-Content make_ibge_offline.py -Encoding UTF8
          python make_ibge_offline.py
          Get-Item offline_ibge_map.json.gz | Format-List Name,Length

      - name: Source self-test
        run: python desktop_app.py --self-test
      - name: Earthdata client import
        run: python -c "import earthaccess; print('EARTHACCESS_IMPORT_OK', earthaccess.__version__)"
      - name: GUI contract test
        shell: pwsh
        timeout-minutes: 3
        run: |
          @'
          import tkinter as tk
          from pathlib import Path
          import desktop_app as app
          app.messagebox.showerror=lambda *a,**k: (_ for _ in ()).throw(RuntimeError("GUI contract encountered a modal error: "+str(a)))
          assert hasattr(app.App, "export_excel"), "App.export_excel missing"
          assert app.primary_ibge_physiognomy({"vegetacao":[{"campo":"legenda_2","classes":[("Floresta Ombrófila Densa das Terras Baixas (classe de cobertura)",90,90)]},{"campo":"legenda_1","classes":[("Floresta Ombrófila Densa das Terras Baixas",100,100)]}]}) == "Floresta Ombrófila Densa das Terras Baixas", "IBGE fitofisionomia must come from dominant legenda_1, not legenda_2"
          assert app.primary_ibge_physiognomy({"vegetacao":[{"campo":"legenda_2","classes":[("classe de cobertura",100,100)]}]}) == "", "missing legenda_1 must not be relabeled as phytogeographic region"
          import geopandas as gpd
          from shapely.geometry import box
          from pyproj import Transformer
          project=gpd.GeoDataFrame({"id":[1]},geometry=[box(-55.01,-3.10,-54.90,-3.00)],crs="EPSG:4326")
          tr=Transformer.from_crs("EPSG:4326","EPSG:5880",always_xy=True)
          regions=[]
          for x0,x1,name,code in [(-55.01,-54.96,"Região A","A1"),(-54.96,-54.90,"Região B","B2")]:
              corners=[tr.transform(x0,-3.10),tr.transform(x1,-3.10),tr.transform(x1,-3.00),tr.transform(x0,-3.00)]
              regions.append((box(min(x for x,y in corners),min(y for x,y in corners),max(x for x,y in corners),max(y for x,y in corners)),name,code))
          theme=gpd.GeoDataFrame({"legenda_1":[r[1] for r in regions],"cd_fito":[r[2] for r in regions]},geometry=[r[0] for r in regions],crs="EPSG:5880")
          shares=app._shares(project,theme,["legenda_1"])
          coded=app._shares_with_code(project,theme,"legenda_1","cd_fito")
          assert shares and shares[0][1][0][0]=="Região B" and coded[0]["name"]=="Região B" and coded[0]["code"]=="B2", "IBGE area-weighted overlay/CRS/code contract failed"
          assert "tCO₂e/ha" in open("desktop_app.py",encoding="utf-8").read(), "dual carbon units missing"
          assert "Compartimentos de carbono" in open("desktop_app.py",encoding="utf-8").read(), "structured Excel exporter missing"
          assert "cod_imovel" in open("desktop_app.py",encoding="utf-8").read(), "SICAR CAR-code filter missing"
          assert "IBGE_VEGE_2026_URL" in open("desktop_app.py",encoding="utf-8").read(), "IBGE 2026 library missing"
          assert "Diagnóstico IBGE" in open("desktop_app.py",encoding="utf-8").read(), "IBGE Excel sheet missing"
          src=open("desktop_app.py",encoding="utf-8").read()
          assert "cod_imovel" in src and "sicar:sicar_imoveis_" in src, "SICAR WFS contract missing"
          assert "DEFAULT@SECLEVEL=1" in src, "SICAR TLS compatibility missing"
          assert "state=\"readonly\"" not in src[src.index("def _project"):src.index("def _spatial")], "manual biome selector still present"
          assert "CCIR — código INCRA/SNCR" in src, "CCIR opening input missing"
          assert "CARREGAR ARQUIVO VETORIAL" in src[src.index("def _project"):src.index("def _spatial")], "opening vector upload missing"
          assert "Buscar CAR no SICAR" not in src and "Buscar CCIR no SIGEF" not in src, "manual registry lookup buttons must be absent"
          assert "A consulta CAR/SICAR ou CCIR/SIGEF ocorre automaticamente" in src, "registry lookup must run from EXECUTAR ANÁLISE"
          assert "Carregar KML / GeoJSON" not in src[src.index("def _spatial"):src.index("def _remote")], "old vector upload still present"
          assert "def _reset_analysis_state" in src, "state reset missing"
          assert src.count("self._reset_analysis_state()") >= 3, "CAR CCIR vector reset hooks missing"
          assert "self.project.pop(k,None)" in src, "execution result invalidation missing"
          assert "active_input_id" in src and "current_car" in src, "fresh-input identity guard missing"
          assert "self.active_source=None; self.active_input_id=None" in src, "startup query state not initialized"
          assert "Bioma e fitofisionomia não são entradas" not in src, "obsolete opening notice still present"
          assert "Erro/incerteza" in src and "Nível estatístico" in src, "statistical uncertainty output missing"; assert "threading.Thread" in src and "_poll_analysis" in src, "async analysis worker missing"; assert "0–200 cm" in src and "pronasolos_soc_profiles" in src, "PronaSolos multi-depth SOC missing"; assert "sicar:sicar_imoveis_" in src and "2.0.0" in src, "CAR WFS fallback missing"; assert "SAR_L_DISPONIVEL_CREDENCIAL_NECESSARIA" not in open("sar_pipeline.py",encoding="utf-8").read(), "L-band catalogue must not block analysis"
          assert "enform_header.png" in src and "Approved high-resolution Enform mask" in src, "approved high-resolution mask missing"
          header_block=src[src.index('visual=base/"enform_header.png"'):src.index("# Global action bar")]
          assert 'header.create_text(34,55,text="enform"' not in header_block and '3.15.0-MULTISOURCE' not in header_block, "duplicate branding/version overlay regression"
          assert "Aspect ratio is preserved" in header_block and "header.bind(\"<Configure>\"" in header_block, "responsive full-mask rendering missing"
          assert "win_w=max(1100,min(1713,screen_w-48))" in src and "header_h=210" in src and "width=288" in src, "responsive approved dashboard proportions missing"
          assert "maps.googleapis.com/maps/api/staticmap" in src and "sentinel2_preview" in src and "World_Imagery" in src and "World_Street_Map" in src, "Google -> Sentinel-2 -> Esri Imagery -> Esri Street fallback chain missing"
          assert "offline_brazil_preview" in src and "offline_brazil_basemap.jpg" in src and Path("offline_brazil_basemap.jpg").exists(), "packaged offline NASA Brazil basemap missing"
          assert "Fitofisionomia IBGE (legenda_1):" in src and "ibge_phys_display" in src and "ibge_biome_display" in src, "visible official IBGE phytophysiognomy panel missing"
          assert "Área do polígono:" in src and "aoi_area_display" in src, "visible polygon area field missing"
          assert "IBGE 2025: UF | municípios | rodovias | ferrovias | hidrovias | hidrografia | aeroportos/portos | localidades" in src, "offline IBGE map legend missing"
          assert "RELATÓRIO SAR — DADOS PROCESSADOS; AGB NÃO ESTIMADA" in src, "SAR-only diagnostic report missing"
          ibge_reader=src[src.index("def _read_zip_bbox"):src.index("def _field",src.index("def _read_zip_bbox"))]
          assert "pyogrio.read_dataframe" in ibge_reader and "extractall" not in ibge_reader, "IBGE memory-safe bbox reader missing"
          assert "LITERATURA_SECUNDARIA" in src, "secondary-analysis fallback provenance missing"
          assert "FALLBACK MICRORREGIONAL — SAR PROCESSADO, SEM MODELO AGB" in src, "processed-SAR secondary estimate status missing"
          assert src.count("ttk.Scrollbar(")>=4, "visible scrollbars missing from report and data panels"
          assert "Nenhum compartimento adicional elegível" in src and "Serapilheira — estoque no piso florestal" in open("sar_pipeline.py",encoding="utf-8").read(), "regional additional biomass compartments or stock-vs-flux distinction missing"
          sar_src=open("sar_pipeline.py",encoding="utf-8").read()
          assert "process_nisar_gcov" in sar_src and "analyze_nisar_gcov" in sar_src, "NISAR GCOV processor missing"
          assert "NISAR_GCOV_HDF5" in sar_src, "NISAR HDF5 route missing"
          assert "select_executable_model" in sar_src, "strict SAR model selector missing"
          assert "cdse_sentinel1_process" in sar_src and "CDSE_PROCESS_URL" in sar_src and "GAMMA0_TERRAIN" in sar_src, "CDSE Sentinel-1 Process API route missing"
          assert "ESA BIOMASS — banda P" in src and "Rotas públicas são tentadas sem credenciais" in src, "automatic BIOMASS/public-first UI missing"
          assert "_earthaccess_requests_session" in sar_src and "earthaccess.get_requests_https_session" in sar_src, "official earthaccess authentication route missing"
          assert "Earthdata Login opcional" in src and "edl_user" in src and "edl_password" in src, "Earthdata username/password UI missing"
          assert "ESA MAAP Long Lasting Token (90 dias)" in src and "esa_token" in src, "ESA MAAP protected-data token field missing"
          assert "sar_attempted_first" in sar_src, "SAR-first fallback audit missing"
          assert "Propriedade (CAR)" in src and "Mapas e limites" in src and "Carregar produtos SAR / AGB" in src, "approved dashboard navigation missing"
          assert "EXECUTAR ANÁLISE" in src, "global analysis control missing"
          assert "Aspect ratio is preserved" in src, "header aspect-ratio protection missing"
          assert "literatura/modelagem somente após falha documentada" in src, "fallback policy regression"
          pipe=sar_src[sar_src.index("def automatic_pipeline"):]; assert pipe.index("biomass_l2b") < pipe.index("planetary_alos_palsar") < pipe.index("planetary_sentinel1_cog"), "SAR priority regression P > L > C"
          assert "planetary_sentinel1_cog" in sar_src and "planetarycomputer.microsoft.com/api/sas/v1/sign" in sar_src, "credential-free real Sentinel-1 pixel route missing"
          assert "planetary_alos_palsar" in sar_src and "alos-palsar-mosaic" in sar_src, "public L-band ALOS/PALSAR route missing"
          assert "lband_dualpol_diagnostic" in sar_src and "SAR_ESTRATIFICADOR" in sar_src, "L-band saturation-aware diagnostic missing"
          assert "full_pol_candidate" in sar_src and "lband_candidate_readiness" in sar_src, "full-pol/GCOV L-band candidate prioritization missing"
          assert "CCIBiomassV5.01" in sar_src and "biomass_l2b_search" in sar_src and "BiomassLevel2bIOC" in sar_src, "ESA CCI/L2B collection discovery regression"
          assert "sar_agb_blocker" in sar_src and "missing_predictors" in sar_src, "exact SAR AGB blocker diagnostics missing"
          assert "_jaxa_mosaic_gamma0_db" in sar_src and "np.square(a)" in sar_src, "JAXA mosaic gamma0 calibration regression"
          assert "BUILTIN_LITERATURE=[]" in sar_src, "generic numeric AGB literature fallback must remain disabled"
          assert "VISUALIZAR SATÉLITE + POLÍGONO" in src and "Esri World Imagery" in src, "satellite polygon visualization/fallback missing"
          assert "Upload concluído ✓" in src and "vector_status" in src, "vector upload filename/status confirmation missing"
          assert "def _draw_aoi_outline" in src, "offline AOI map preview missing"
          assert "def _schedule_offline_map_fit" in src and "mapa vetorial offline" in src, "offline AOI map must be authoritative and automatic"
          assert "_map_generation" in src and "_refresh_satellite_after_resize" in src, "map stale-response/resize guards missing"
          assert "def map_zoom_in" in src and "def map_zoom_out" in src and "def map_zoom_fit" in src and "_map_extent_factor" in src, "geographic map zoom controls missing"
          assert "def _apply_map_zoom" in src and "_map_provider" in src and "OFFLINE_NASA_IBGE" in src, "offline map zoom must be immediate and network-independent"
          assert "map_hscroll" in src and "map_vscroll" in src and "scrollregion" in src, "map/tab scrollbars missing"
          assert "generation!=self._map_generation" in src, "stale asynchronous map response guard missing"
          assert "threading.Thread(target=worker" in src, "satellite map network requests must not block the UI"
          assert Path("enform_header.png").exists() and Path("enform_header.png").stat().st_size > 20000, "forest/logo visual asset missing"
          import scientific_calibration as sc
          assert len(sc.SCIENTIFIC_INVENTORY_REGISTRY) >= 7, "scientific inventory registry incomplete"
          assert any("Embrapa" in x["institution"] for x in sc.SCIENTIFIC_INVENTORY_REGISTRY), "Embrapa evidence missing"
          assert any("UFRA" in x["institution"] for x in sc.SCIENTIFIC_INVENTORY_REGISTRY), "UFRA evidence missing"
          assert any(("UFLA" in x["institution"] or "UFV" in x["institution"]) for x in sc.SCIENTIFIC_INVENTORY_REGISTRY), "UFLA/UFV evidence missing"
          t=sc.glcm_features([[1,2,3],[2,3,4],[3,4,5]]); assert "entropy" in t and "contrast" in t, "GLCM engine missing"
          a=sc.saturation_audit(418.66155,["C","L","P","X"]); assert a["bands"]["L"]["state"]=="high_risk", "dense-forest saturation audit missing"
          assert sc.rank_external_evidence("Amazônia","floresta tropical","Pará"), "scientific evidence ranking missing"
          assert "estoque_carbono_90m/MapServer/identify" in src, "verified PronaSolos endpoint missing"
          assert "solos_90m/MapServer/identify" not in src and "atributos_solo_90m/MapServer/identify" not in src, "unverified soil endpoints must not be used"
          assert "layer_means_tc_ha" in src and "valid_by_layer" in src, "soil depth diagnostics missing"
          assert "descoberta ≠ download ≠ processamento ≠ uso" in src, "SAR discovery state labels missing"
          assert "Bioma" not in src[src.index("def _project"):src.index("def _spatial")].split("Esses campos")[0] if False else True
          ui=app.App()
          ui.update_idletasks()
          kmz=Path("acceptance/Teste_SAR_Biomassa_Tapajos.kmz").resolve()
          preflight=app.read_vector(kmz)
          assert len(preflight)>0, "KMZ preflight returned no geometry"
          area=app.geom_metrics(preflight)["area_ha"]
          assert area>0, "AOI area must be positive"
          print("VISIBLE_AOI_AREA_OK",area)
          offline,_=app.offline_brazil_preview(preflight,1.36,(900,420))
          assert offline.size==(900,420), "offline NASA basemap render failed"
          print("OFFLINE_NASA_MAP_OK",offline.size)
          app.filedialog.askopenfilename=lambda **kwargs:str(kmz)
          ui._show_geom=lambda name:ui._draw_aoi_outline("Perímetro carregado: "+name)
          ui.pick_vector()
          ui.update_idletasks()
          assert "Upload concluído" in ui.vector_status.get() and kmz.name in ui.vector_status.get(), "AOI filename/upload confirmation missing"
          assert any(ui.map_canvas.type(i)=="polygon" for i in ui.map_canvas.find_all()), "Tapajos polygon was not rendered in the map preview"
          # Real satellite fallback: no Google key -> Sentinel-2 first, Esri only if Sentinel-2 fails.
          import time
          ui.google_maps_key.set("")
