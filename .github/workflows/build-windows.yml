          assert "VISUALIZAR SATÉLITE + POLÍGONO" in src and "Fundo óptico: CBERS-4A/WFI prioritária; Sentinel-2 como alternativa. Leitura por quadrantes ≤512 px" in src, "CBERS-first tiled optical-background contract missing"
          assert "Upload concluído ✓" in src and "vector_status" in src, "vector upload filename/status confirmation missing"
