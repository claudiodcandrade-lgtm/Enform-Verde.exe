name: Build Enform Verde Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_desktop.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_desktop.txt
          pip install pillow
      - name: Source self-test
        run: python desktop_app.py --self-test
      - name: GUI contract test
        shell: pwsh
        timeout-minutes: 3
        run: |
          @'
          import tkinter as tk
          from pathlib import Path
          import desktop_app as app
          app.messagebox.showerror=lambda *a,**k: (_ for _ in ()).throw(RuntimeError("GUI contract encountered a modal error: "+str(a)))
          assert hasattr(app.App, "export_excel"), "App.export_excel missing"
          assert "tCO₂e/ha" in open("desktop_app.py",encoding="utf-8").read(), "dual carbon units missing"
          assert "Compartimentos de carbono" in open("desktop_app.py",encoding="utf-8").read(), "structured Excel exporter missing"
          assert "cod_imovel" in open("desktop_app.py",encoding="utf-8").read(), "SICAR CAR-code filter missing"
          assert "IBGE_VEGE_2026_URL" in open("desktop_app.py",encoding="utf-8").read(), "IBGE 2026 library missing"
          assert "Diagnóstico IBGE" in open("desktop_app.py",encoding="utf-8").read(), "IBGE Excel sheet missing"
          src=open("desktop_app.py",encoding="utf-8").read()
          assert "cod_imovel" in src and "sicar:sicar_imoveis_" in src, "SICAR WFS contract missing"
          assert "DEFAULT@SECLEVEL=1" in src, "SICAR TLS compatibility missing"
          assert "state=\"readonly\"" not in src[src.index("def _project"):src.index("def _spatial")], "manual biome selector still present"
          assert "CCIR — código INCRA/SNCR" in src, "CCIR opening input missing"
          assert "CARREGAR ARQUIVO VETORIAL" in src[src.index("def _project"):src.index("def _spatial")], "opening vector upload missing"
          assert "Buscar CAR no SICAR" not in src and "Buscar CCIR no SIGEF" not in src, "manual registry lookup buttons must be absent"
          assert "A consulta CAR/SICAR ou CCIR/SIGEF ocorre automaticamente" in src, "registry lookup must run from EXECUTAR ANÁLISE"
          assert "Carregar KML / GeoJSON" not in src[src.index("def _spatial"):src.index("def _remote")], "old vector upload still present"
          assert "def _reset_analysis_state" in src, "state reset missing"
          assert src.count("self._reset_analysis_state()") >= 3, "CAR CCIR vector reset hooks missing"
          assert "self.project.pop(k,None)" in src, "execution result invalidation missing"
          assert "active_input_id" in src and "current_car" in src, "fresh-input identity guard missing"
          assert "self.active_source=None; self.active_input_id=None" in src, "startup query state not initialized"
          assert "Bioma e fitofisionomia não são entradas" not in src, "obsolete opening notice still present"
          assert "Erro/incerteza" in src and "Nível estatístico" in src, "statistical uncertainty output missing"; assert "threading.Thread" in src and "_poll_analysis" in src, "async analysis worker missing"; assert "0–200 cm" in src and "pronasolos_soc_profiles" in src, "PronaSolos multi-depth SOC missing"; assert "sicar:sicar_imoveis_" in src and "2.0.0" in src, "CAR WFS fallback missing"; assert "SAR_L_DISPONIVEL_CREDENCIAL_NECESSARIA" not in open("sar_pipeline.py",encoding="utf-8").read(), "L-band catalogue must not block analysis"
          assert "enform_header.png" in src and "Approved high-resolution Enform mask" in src, "approved high-resolution mask missing"
          header_block=src[src.index('visual=base/"enform_header.png"'):src.index("# Global action bar")]
          assert 'header.create_text(34,55,text="enform"' not in header_block and '3.15.0-MULTISOURCE' not in header_block, "duplicate branding/version overlay regression"
          assert "Aspect ratio is preserved" in header_block and "header.bind(\"<Configure>\"" in header_block, "responsive full-mask rendering missing"
          assert "win_w=max(1100,min(1713,screen_w-48))" in src and "header_h=210" in src and "width=288" in src, "responsive approved dashboard proportions missing"
          assert "Esri World Imagery (público)" in src and "server.arcgisonline.com/ArcGIS/rest/services/World_Imagery" in src, "no-key satellite polygon map fallback missing"
          assert "RELATÓRIO SAR — DADOS PROCESSADOS; AGB NÃO ESTIMADA" in src, "SAR-only diagnostic report missing"
          ibge_reader=src[src.index("def _read_zip_bbox"):src.index("def _field",src.index("def _read_zip_bbox"))]
          assert "pyogrio.read_dataframe" in ibge_reader and "extractall" not in ibge_reader, "IBGE memory-safe bbox reader missing"
          assert "LITERATURA_SECUNDARIA" in src, "secondary-analysis fallback provenance missing"
          assert "FALLBACK MICRORREGIONAL — SAR PROCESSADO, SEM MODELO AGB" in src, "processed-SAR secondary estimate status missing"
          sar_src=open("sar_pipeline.py",encoding="utf-8").read()
          assert "process_nisar_gcov" in sar_src and "analyze_nisar_gcov" in sar_src, "NISAR GCOV processor missing"
          assert "NISAR_GCOV_HDF5" in sar_src, "NISAR HDF5 route missing"
          assert "select_executable_model" in sar_src, "strict SAR model selector missing"
          assert "cdse_sentinel1_process" in sar_src and "CDSE_PROCESS_URL" in sar_src and "GAMMA0_TERRAIN" in sar_src, "CDSE Sentinel-1 Process API route missing"
          assert "ESA BIOMASS — banda P" in src and "Não é necessário informar tokens Earthdata/ESA" in src, "automatic BIOMASS/token-free UI missing"
          assert "edl_token" in sar_src and 'Authorization":"Bearer "' in sar_src, "Earthdata token auth missing"
          assert "sar_attempted_first" in sar_src, "SAR-first fallback audit missing"
          assert "Propriedade (CAR)" in src and "Mapas e limites" in src and "Carregar produtos SAR / AGB" in src, "approved dashboard navigation missing"
          assert "EXECUTAR ANÁLISE" in src, "global analysis control missing"
          assert "Aspect ratio is preserved" in src, "header aspect-ratio protection missing"
          assert "literatura/modelagem somente após falha documentada" in src, "fallback policy regression"
          pipe=sar_src[sar_src.index("def automatic_pipeline"):]; assert pipe.index("biomass_l2b") < pipe.index("planetary_alos_palsar") < pipe.index("planetary_sentinel1_cog"), "SAR priority regression P > L > C"
          assert "planetary_sentinel1_cog" in sar_src and "planetarycomputer.microsoft.com/api/sas/v1/sign" in sar_src, "credential-free real Sentinel-1 pixel route missing"
          assert "planetary_alos_palsar" in sar_src and "alos-palsar-mosaic" in sar_src, "public L-band ALOS/PALSAR route missing"
          assert "BUILTIN_LITERATURE=[]" in sar_src, "generic numeric AGB literature fallback must remain disabled"
          assert "VISUALIZAR SATÉLITE + POLÍGONO" in src and "Esri World Imagery (público)" in src, "satellite polygon visualization missing"
          assert "Upload concluído ✓" in src and "vector_status" in src, "vector upload filename/status confirmation missing"
          assert "def _draw_aoi_outline" in src, "offline AOI map preview missing"
          assert "threading.Thread(target=worker" in src, "satellite map network requests must not block the UI"
          assert Path("enform_header.png").exists() and Path("enform_header.png").stat().st_size > 20000, "forest/logo visual asset missing"
          import scientific_calibration as sc
          assert len(sc.SCIENTIFIC_INVENTORY_REGISTRY) >= 7, "scientific inventory registry incomplete"
          assert any("Embrapa" in x["institution"] for x in sc.SCIENTIFIC_INVENTORY_REGISTRY), "Embrapa evidence missing"
          assert any("UFRA" in x["institution"] for x in sc.SCIENTIFIC_INVENTORY_REGISTRY), "UFRA evidence missing"
          assert any(("UFLA" in x["institution"] or "UFV" in x["institution"]) for x in sc.SCIENTIFIC_INVENTORY_REGISTRY), "UFLA/UFV evidence missing"
          t=sc.glcm_features([[1,2,3],[2,3,4],[3,4,5]]); assert "entropy" in t and "contrast" in t, "GLCM engine missing"
          a=sc.saturation_audit(418.66155,["C","L","P","X"]); assert a["bands"]["L"]["state"]=="high_risk", "dense-forest saturation audit missing"
          assert sc.rank_external_evidence("Amazônia","floresta tropical","Pará"), "scientific evidence ranking missing"
          assert "estoque_carbono_90m/MapServer/identify" in src, "verified PronaSolos endpoint missing"
          assert "solos_90m/MapServer/identify" not in src and "atributos_solo_90m/MapServer/identify" not in src, "unverified soil endpoints must not be used"
          assert "layer_means_tc_ha" in src and "valid_by_layer" in src, "soil depth diagnostics missing"
          assert "descoberta ≠ download ≠ processamento ≠ uso" in src, "SAR discovery state labels missing"
          assert "Bioma" not in src[src.index("def _project"):src.index("def _spatial")].split("Esses campos")[0] if False else True
          ui=app.App()
          ui.update_idletasks()
          kmz=Path("acceptance/Teste_SAR_Biomassa_Tapajos.kmz").resolve()
          preflight=app.read_vector(kmz)
          assert len(preflight)>0, "KMZ preflight returned no geometry"
          app.filedialog.askopenfilename=lambda **kwargs:str(kmz)
          ui._show_geom=lambda name:ui._draw_aoi_outline("Perímetro carregado: "+name)
          ui.pick_vector()
          ui.update_idletasks()
          assert "Upload concluído" in ui.vector_status.get() and kmz.name in ui.vector_status.get(), "AOI filename/upload confirmation missing"
          assert any(ui.map_canvas.type(i)=="polygon" for i in ui.map_canvas.find_all()), "Tapajos polygon was not rendered in the map preview"
          import tempfile
          with tempfile.TemporaryDirectory() as td:
              geojson=Path(td)/"tapajos_acceptance.geojson"
              app.read_vector(kmz).to_file(geojson,driver="GeoJSON")
              app.filedialog.askopenfilename=lambda **kwargs:str(geojson)
              ui.pick_vector(); ui.update_idletasks()
              assert "Upload concluído" in ui.vector_status.get() and geojson.name in ui.vector_status.get(), "GeoJSON upload confirmation missing"
              assert any(ui.map_canvas.type(i)=="polygon" for i in ui.map_canvas.find_all()), "GeoJSON AOI was not rendered"
          ui.destroy()
          print("GUI_CONTRACT_OK")
          '@ | Set-Content gui_contract_test.py -Encoding UTF8
          python gui_contract_test.py
      - name: Live public SAR pixel processing and regional fallback — actual Tapajos KMZ
        shell: pwsh
        run: |
          @'
          import sar_pipeline as s
          import desktop_app as a
          g=a.read_vector("acceptance/Teste_SAR_Biomassa_Tapajos.kmz")
          r=s.planetary_sentinel1_cog(g,"sar_ci_cache",limit=4)
          assert r.get("stats"), "Sentinel-1 catalog responded but no real AOI pixels were processed: "+str(r.get("errors"))
          assert sum(x.get("n",0) for x in r["stats"])>0
          l=s.planetary_alos_palsar(g,"sar_ci_cache/alos",limit=4)
          assert l.get("stats"), "ALOS/PALSAR L-band returned no processed Tapajos pixels: "+str(l.get("errors"))
          assert sum(x.get("n",0) for x in l["stats"])>0
          lit=s.literature_fallback("Amazônia","Floresta Ombrófila Densa das Terras Baixas",aoi=g)
          assert lit and lit["available"] and abs(lit["agb_mg_ha"]-273.515)<1e-6
          assert lit["sar_metrics"]["RMSE"] is None and lit["agb_range_mg_ha"][0]<lit["agb_mg_ha"]<lit["agb_range_mg_ha"][1]
          assert "não é IC95%" in lit["uncertainty_kind"]
          import json
          print("LIVE_TAPAJOS_KMZ_SAR_AND_REGIONAL_REFERENCE_OK "+json.dumps({"sentinel1":r["stats"],"alos_palsar":l["stats"],"agb_reference":lit},ensure_ascii=True))
          '@ | Set-Content live_sar_test.py -Encoding UTF8
          python live_sar_test.py

      - name: Live SICAR polygon lookup
        shell: pwsh
        run: |
          python -c "import desktop_app as a; g1=a.resolve_car('MT-5108501-CBE0F5EDD27A4D7888E7392EA7D44793'); g2=a.resolve_car('MT-5103700-92A39DC62FDF4D88874F218D41BE1C7F'); assert len(g1)==1 and len(g2)==1; assert tuple(g1.total_bounds)!=tuple(g2.total_bounds); print('SICAR_SEQUENCE_OK',g1.crs,g2.crs)"
      - name: Professional scientific contracts
        shell: pwsh
        run: |
          python -c "import sar_pipeline as s; m=[x for x in s.MODEL_REGISTRY if x.get('executable')]; assert any(x['id']=='CASSOL_2019_EQ13' for x in m); assert m[0].get('rmse_mg_ha') is not None; print('EXECUTABLE_MODEL_REGISTRY_OK')"
          python -c "import numpy as np; from scientific_calibration import fit_local_powerlaw_calibration as f; groups=np.repeat(['site1','site2','site3','site4','site5','site6'],6); agb=np.tile(np.array([40,60,80,100,130,170.]),6); cb=0.003*np.power(agb,0.72)*(1+np.tile(np.array([-.02,.01,0,.02,-.01,0]),6)); m=f(cb,agb,groups); assert m['metrics']['independent_groups']==6 and m['metrics']['RMSE_Mg_ha']<5 and m['alpha']>0; print('ROBUST_P_BAND_GROUPED_CALIBRATION_OK',m['metrics'])"
          python -c "from lband_preprocess import _safe_target; from pathlib import Path; import tempfile; root=Path(tempfile.mkdtemp()); assert _safe_target(root,'scene/subset.tif').parent==root/'scene'; rejected=False; exec('try:\n _safe_target(root,\"../escape.txt\")\nexcept ValueError:\n rejected=True'); assert rejected; print('ARCHIVE_PATH_TRAVERSAL_GUARD_OK')"
          @'
          import tempfile
          import desktop_app as a
          import sar_pipeline as s
          ccir_query={}
          class FakeResponse:
              ok=True
              def json(self): return {"results":[{"type":"Feature","geometry":{"type":"Polygon","coordinates":[[[-54.96,-3.05],[-54.95,-3.05],[-54.95,-3.04],[-54.96,-3.04],[-54.96,-3.05]]]},"properties":{}}]}
          class FakeSession:
              headers={}
              def get(self,url,params,timeout): ccir_query.update(params); return FakeResponse()
          real_session=a.requests.Session; a.requests.Session=lambda:FakeSession()
          try:
              ccir_gdf=a.resolve_ccir_sigef("1.234.567.890.123")
              assert len(ccir_gdf)==1 and ccir_query.get("codigo_imovel")=="1234567890123", "formatted CCIR normalization/SIGEF geometry lookup failed"
          finally:a.requests.Session=real_session
          print("CCIR_SIGEF_FORMATTED_REFERENCE_OK")
          g=a.read_vector("acceptance/Teste_SAR_Biomassa_Tapajos.kmz")
          s.maap_search=lambda *args,**kwargs:[]
          s.discover_asf=lambda *args,**kwargs:[]
          s.planetary_alos_palsar=lambda *args,**kwargs:{"items":1,"scene_ids":["mock-L-test"],"paths":[],"stats":[{"scene":"mock-L-test","polarization":"HH","n":10,"pixel_state":"PROCESSADO"}],"errors":[],"provider":"mock test","pixel_state":"PROCESSADO"}
          s.planetary_sentinel1_cog=lambda *args,**kwargs:{"items":1,"scene_ids":["mock-C-test"],"paths":[],"stats":[{"scene":"mock-C-test","polarization":"VV","n":10,"pixel_state":"PROCESSADO"}],"errors":[],"provider":"mock test","pixel_state":"PROCESSADO"}
          s.public_sentinel1_cog=lambda *args,**kwargs:{"items":0,"paths":[],"stats":[],"errors":[],"provider":"mock test"}
          s.cci_history=lambda *args,**kwargs:{"items":0,"paths":[]}
          with tempfile.TemporaryDirectory() as td:
              out=s.automatic_pipeline(g,"Amazônia","Floresta Ombrófila Densa das Terras Baixas",cache=td)
          lit=out["literature_reference"]
          assert out["status"]=="SAR_PROCESSADO_SEM_MODELO_AGB" and lit["available"] and lit["sar_processed"]
          assert abs(lit["agb_mg_ha"]-273.515)<1e-6 and len(lit["sar_pixel_audit"])==2
          print("AUTOMATIC_SAR_TO_MICROREGIONAL_FALLBACK_FLOW_OK")
          '@ | Set-Content fallback_flow_test.py -Encoding UTF8
          python fallback_flow_test.py
          python -c "import lband_preprocess as l; assert l.calibrate_jaxa_l15_l21([10])[0] == l.calibrate_jaxa_l15_l21([10])[0]; print('LBAND_PREPROCESS_OK')"

      - name: Create icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw, ImageFont
          im=Image.new('RGBA',(256,256),(22,92,58,255))
          d=ImageDraw.Draw(im); d.ellipse((28,28,228,228),fill=(240,248,242,255)); d.ellipse((48,48,208,208),fill=(38,125,76,255))
          try: font=ImageFont.truetype('arialbd.ttf',64)
          except: font=ImageFont.load_default()
          d.text((72,88),'EV',fill='white',font=font)
          im.save('enform_verde.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content make_icon.py -Encoding UTF8
          python make_icon.py
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --onedir --name "Enform Verde" --icon enform_verde.ico --add-data "enform_header.png;." --collect-all pandas --collect-all openpyxl --collect-all geopandas --collect-all pyogrio --collect-all rasterio --collect-all pyproj desktop_app.py
      - name: Place approved visual asset beside EXE
        shell: pwsh
        run: Copy-Item -Force 'enform_header.png' 'dist\Enform Verde\enform_header.png'
      - name: Verify packaged Python runtime
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist\Enform Verde'
          $exe = Join-Path $root 'Enform Verde.exe'
          $dll = Get-ChildItem -Path $root -Recurse -Filter 'python311.dll' | Select-Object -First 1
          if (!(Test-Path $exe)) { throw 'Enform Verde.exe was not created' }
          if (!$dll) { throw 'python311.dll is missing from packaged application' }
          $header = Join-Path $root 'enform_header.png'
          if (!(Test-Path $header)) { throw 'enform_header.png is missing from packaged application' }
          if ((Get-Item $header).Length -lt 20000) { throw 'Approved high-resolution Enform mask is unexpectedly small' }
          Write-Host "Embedded runtime: $($dll.FullName)"
      - name: Compiled EXE self-test from clean copied folder
        shell: pwsh
        run: |
          $src = Join-Path $PWD 'dist\Enform Verde'
          $dst = Join-Path $env:RUNNER_TEMP 'Enform Verde Clean Test'
          Copy-Item -Path $src -Destination $dst -Recurse
          $exe = Join-Path $dst 'Enform Verde.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -WorkingDirectory $dst -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "EXE self-test failed: $($p.ExitCode)" }
      - name: Add instructions
        shell: pwsh
        run: |
          @'
          ENFORM VERDE - WINDOWS
          Para abrir: dê duplo clique em "Enform Verde.exe".
          Não é necessário instalar Python. Mantenha o EXE e a pasta _internal juntos.
          IMPORTANTE: extraia TODO o ZIP antes de abrir. Não execute o EXE de dentro do ZIP.
          A análise espacial aceita vetor local e tenta consulta pública do SICAR, SIGEF e Embrapa quando houver internet.
          '@ | Set-Content 'dist\Enform Verde\LEIA-ME.txt' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Enform-Verde-Windows-v3.24.2-PROFESSIONAL
          path: dist/Enform Verde/
          if-no-files-found: error
          retention-days: 30
