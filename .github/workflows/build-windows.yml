          assert "win_w=max(1100,min(1713,screen_w-48))" in src and "header_h=210" in src and "width=288" in src, "responsive approved dashboard proportions missing"
          assert "cbers4a_wfi_preview" in src and "sentinel2_earthsearch_preview" in src and "sentinel2_preview" in src, "CBERS-4A/Sentinel-2 real-pixel providers missing"
          map_worker=src[src.index("        def worker():",src.index("def show_google_map")):src.index("        threading.Thread(target=worker",src.index("def show_google_map"))]
          assert map_worker.index("cbers4a_wfi_preview(g,out_w=w") < map_worker.index("sentinel2_earthsearch_preview(g,out_w=w") < map_worker.index("sentinel2_preview(g,extent_factor=extent_factor)") < map_worker.index("if cached_optical:") < map_worker.index("nasa_gibs_preview(g,out_w=w") < map_worker.index("im=esri_export(rs,service="), "CBERS-4A remains primary; Sentinel-2, optical cache, NASA and Esri are bounded fallbacks"
          tls_src=open("tls_setup.py",encoding="utf-8").read()
          assert "_uses_windows_schannel" in tls_src and "WINDOWS_SCHANNEL_CA_LIMIT" in tls_src and "GDAL_HTTP_UNSAFESSL" in tls_src, "Windows Schannel trust handling or TLS verification missing"
          for optical_fn in ("cbers4a_wfi_preview","sentinel2_earthsearch_preview","sentinel2_preview"):
              optical_body=src[src.index("def "+optical_fn):src.find("\ndef ",src.index("def "+optical_fn)+4)]
              assert "tls_setup.gdal_env()" in optical_body, f"{optical_fn} must use platform-safe shared GDAL TLS settings"
              assert "verify=False" not in optical_body and "GDAL_HTTP_UNSAFESSL=YES" not in optical_body, f"{optical_fn} must preserve TLS verification"
          assert "offline_brazil_preview" not in src and "offline_ibge_map.json.gz" not in src, "cartographic raster background must not block optical imagery"
          assert "Fitofisionomias (SAR atual / potencial IBGE):" in src and "ibge_phys_display" in src and "ibge_biome_display" in src and "format_property_physiognomies" in src, "visible actual property physiognomy panel missing"
          assert "def pick_ibge_physiognomy" in src and "FITOFISIONOMIA À QUAL SE APLICA A ESTIMATIVA" in src and "Carbono por Formação" in src and "AGB por Fitofisionomia" in src, "per-class IBGE SAR reporting/export missing"
          import gravimetric_stock as gs
          assert gs.litter_stock_from_quadrats([250,500],[0.25,0.25])["n_independent_units"] == 2, "gravimetric module runtime contract failed"
          assert "Área do polígono:" in src and "aoi_area_display" in src, "visible polygon area field missing"
