name: Build Enform Verde Windows
on:
  push:
    branches: [main, patches-3.26.6]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Cancel superseded PR jobs; every surviving job still checks out and verifies its exact source SHA.
  group: enform-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge refs are synthetic and NOT the branch HEAD used for release.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_desktop.txt
      - name: Resolve application version (single source - desktop_app.APP_VERSION)
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path desktop_app.py -Pattern '^APP_VERSION="([^"]+)"' | Select-Object -First 1
          if (!$line) { throw 'APP_VERSION not found in desktop_app.py' }
          $ver = $line.Matches[0].Groups[1].Value
          $num = ($ver -split '-')[0]
          if ($num -notmatch '^\d+\.\d+\.\d+$') { throw "APP_VERSION must start with MAJOR.MINOR.PATCH: $ver" }
          $notes = "APP_RELEASE_NOTES_v$num.md"
          if (!(Test-Path $notes)) { throw "Release notes $notes are required for every new version" }
          git fetch --tags --quiet origin 2>$null
          $tag = "v$ver"
          $tagged = (git rev-list -n 1 $tag 2>$null)
          $head = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($tagged -and $tagged.Trim() -ne $head) {
            $msg = "Version $ver is already published at $tagged. Increment APP_VERSION for this new build."
            if ('${{ github.event_name }}' -eq 'push') { throw $msg } else { Write-Host "::warning::$msg" }
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION_NUM=$num" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ENFORM_APP_VERSION $ver"
          # git rev-list exits 128 when the tag does not exist; that is the
          # normal case for a NEW version and must not fail the step.
          $global:LASTEXITCODE = 0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_desktop.txt
          pip install pillow
