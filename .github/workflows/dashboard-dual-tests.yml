name: Dashboard dual - tests
on:
  push:
    branches: [feature/agricultural-identification-native-carbon]
  pull_request:
  workflow_dispatch:
jobs:
  dashboard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        shell: pwsh
        run: python -m py_compile desktop_app.py carbon_dashboard_html.py dual_executive_dashboard.py carbon_report_clarity.py crop_health_yield_quality.py agricultural_diagnostic_quality.py agricultural_weather_sources.py agricultural_weather.py cptec_forecast_client.py
      - name: Unit and regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_dual_dashboard.py' -v
          python -m unittest discover -s tests -p 'test_agricultural_weather.py' -v
          python -m unittest discover -s tests -p 'test_enform_uncertainty_core.py' -v
          python -m unittest discover -s tests -p 'test_soil_profile_stats.py' -v
          python -m unittest discover -s tests -p 'test_root_allometry_uncertainty.py' -v
          python -m unittest discover -s tests -p 'test_agricultural_external_models.py' -v
